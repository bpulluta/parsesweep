name: Docs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least-privilege by default; the deploy step needs write access to push
# the built site to the gh-pages branch.
permissions:
  contents: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.8.0
        with:
          pixi-version: "latest"
          environments: docs

      # Build with -W (warnings-as-errors) via the docs environment, so a
      # broken docstring or dead xref fails the PR check.
      - run: pixi run -e docs docs-build

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs/_build/html
