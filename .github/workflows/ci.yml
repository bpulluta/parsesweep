name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # CLI tests assert on plain-text error output; keep Rich color off so ANSI
    # codes don't split asserted substrings. (conftest.py also enforces this.)
    env:
      NO_COLOR: "1"
      TERM: dumb
    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.8.0
        with:
          pixi-version: "latest"
          environments: dev

      - name: Run tests
        run: pixi run -e dev test

      # The codebase carries known ruff debt (E501/W505/formatting) that is not
      # gated here. What IS enforced is the docstring standard the project
      # maintains: zero pydocstyle (D) violations under the project's ruff
      # config. Keep this green — it is the contract Phases 2-3 established.
      - name: Docstring lint (pydocstyle D must stay at 0)
        run: |
          count=$(pixi run -e dev ruff check src/ --output-format=concise 2>/dev/null \
            | grep -cE ' D[0-9]' || true)
          echo "pydocstyle (D) violations: $count"
          test "$count" -eq 0
