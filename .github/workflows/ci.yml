name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # CLI tests assert on plain-text error output; keep Rich color off so ANSI
    # codes don't split asserted substrings. (conftest.py also enforces this.)
    env:
      NO_COLOR: "1"
      TERM: dumb
      PYTHONHASHSEED: "0"
      PYTHON_DOTENV_DISABLED: "1"
      TZ: UTC
      LITELLM_LOCAL_MODEL_COST_MAP: "True"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: prefix-dev/setup-pixi@a0af7a228712d6121d37aba47adf55c1332c9c2e # v0.9.4
        with:
          pixi-version: "0.83.0"
          environments: default dev
          locked: true

      - name: Smoke-test the default runtime entry point
        run: pixi run --locked psweep --help

      - name: Run tests
        run: pixi run --locked -e dev test

      # The codebase carries known ruff debt (E501/W505/formatting) that is not
      # gated here. What IS enforced is the docstring standard the project
      # maintains: zero pydocstyle (D) violations under the project's ruff
      # config. Keep this green — it is the contract Phases 2-3 established.
      - name: Docstring lint (pydocstyle D must stay at 0)
        run: |
          pixi run --locked -e dev python - <<'PY'
          import subprocess
          import sys
          import tomllib
          from pathlib import Path

          config = tomllib.loads(Path("pyproject.toml").read_text())
          # CLI selection takes precedence over config ignores; preserve policy.
          ignored = config["tool"]["ruff"]["lint"]["ignore"]
          sys.exit(subprocess.call([
              "ruff", "check", "src/", "--select", "D",
              "--ignore", ",".join(ignored),
          ]))
          PY

      - name: Selected correctness and security rules
        run: >-
          pixi run --locked -e dev ruff check src/
          --select F821,F822,F823,B006,B012,B023,S102,S307,S501,S502,S506,S602

      - name: Build wheel and source distribution
        run: pixi run --locked -e dev python -m build --no-isolation

      - name: Install wheel outside the source tree
        shell: bash
        run: |
          pixi run --locked -e dev python - <<'PY' > wheel-constraints.txt
          from importlib.metadata import distributions
          for dist in distributions():
              name = dist.metadata["Name"]
              if name and name.lower() != "psweep":
                  print(f"{name}=={dist.version}")
          PY
          pixi run --locked -e dev python -m venv --without-pip .wheel-smoke
          pixi run --locked -e dev python -m pip --python .wheel-smoke/bin/python install --constraint wheel-constraints.txt dist/*.whl
          pixi run --locked -e dev python -m pip --python .wheel-smoke/bin/python check
          mkdir -p .wheel-smoke/work
          cd .wheel-smoke/work
          ../bin/python -I -c "from importlib.metadata import metadata; from psweep.extraction.llm_client import LLMClient; from psweep.compilation.excel_formatter import ExcelFormatter; import truststore; assert metadata('psweep')['Requires-Python'] == '>=3.12'"
          ../bin/psweep --help
