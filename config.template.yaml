# Configuration Template for Web Scraping

# Copy this file to config.yaml and fill in your values
# DO NOT commit config.yaml to git (it's in .gitignore)

# API Keys for LLM-based extraction
api_keys:
  openai: "YOUR_OPENAI_API_KEY"
  anthropic: "YOUR_ANTHROPIC_API_KEY"  # Optional
  llama_extract: "YOUR_LLAMA_EXTRACT_KEY"  # If using LlamaExtract

# Web Scraping Settings
scraping:
  rate_limit_seconds: 2.0  # Delay between requests
  timeout_seconds: 30
  max_retries: 3
  user_agent: "DataCenterResearch/1.0 (Academic Research)"
  respect_robots_txt: true

# State-specific database URLs
# See docs/references for complete list
permit_databases:
  virginia:
    name: "Virginia DEQ"
    base_url: "https://www.deq.virginia.gov/permits"
    search_url: "https://www.deq.virginia.gov/permits/search"
    requires_auth: false
    scraping_method: "requests"  # or "selenium"
  
  illinois:
    name: "Illinois EPA"
    base_url: "https://www2.illinois.gov/epa"
    search_url: ""
    requires_auth: false
    scraping_method: "selenium"
  
  pennsylvania:
    name: "PA eFACTS"
    base_url: "https://www.ahs.dep.pa.gov/eFACTS"
    requires_auth: true
    scraping_method: "manual"
  
  # Add other states...

# Extraction Settings
extraction:
  model: "gpt-4"  # or "gpt-3.5-turbo", "claude-3-opus", etc.
  temperature: 0.0  # Lower = more deterministic
  max_tokens: 4000
  schema_path: "docs/schemas/Air_Quality_Permits.json"
  
  # Retry settings for failed extractions
  retry_on_error: true
  max_extraction_retries: 2

# File Paths
paths:
  data_sources: "01_data_sources"
  data_lists: "02_data_lists"
  permit_documents: "03_permit_documents"
  extracted_data: "04_extracted_data"
  outputs: "06_outputs"
  
  # Input files
  facility_list: "02_data_lists/pjm_territory/pjm_operating_data_centers.csv"
  schema_file: "docs/schemas/Air_Quality_Permits.json"

# Logging
logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR
  log_file: "logs/scraper.log"
  log_to_console: true

# Quality Control
quality_control:
  min_completeness_pct: 80  # Minimum % of fields required
  require_manual_review: true
  validation_sample_size: 10  # Number to manually validate
