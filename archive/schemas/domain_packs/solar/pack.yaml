name: solar
version: 1.0.0
schema_path: schemas/personal/solar_ordinance_schema.json
document_type: Solar Ordinance
compilation:
  deduplication:
    key_fields:
    - feature
    - specific_subject
    - value
    - units
    - condition
    - value_type
    ignore_fields:
    - details
    - notes
modules:
- module_id: value_semantics_classifier
  name: Value Semantics Classifier
  version: 1.0.0
  kind: classifier
  enabled: true
- module_id: eligibility_policy_engine
  name: Eligibility Policy Engine
  version: 1.0.0
  kind: policy
  enabled: true
- module_id: lane_projector
  name: Lane Projector
  version: 1.0.0
  kind: projector
  enabled: true
- module_id: compilation_mapper
  name: Consolidation Mapper
  version: 1.0.0
  kind: mapper
  enabled: true
qaqc:
  default_lane: quantitative
  lanes:
    quantitative:
      enabled: true
      mode: quantitative
      comparison_approach: numeric_only
      record_matching:
        key_fields:
        - feature
        - specific_subject
        - value
        - units
        - condition
        - value_type
      comparison:
        primary_fields:
        - value
        - units
    qualitative:
      enabled: false
      mode: qualitative
      comparison_approach: text_review
      record_matching:
        key_fields:
        - feature
        - specific_subject
        - value
        - units
        - condition
        - value_type
      comparison:
        primary_fields:
        - details
