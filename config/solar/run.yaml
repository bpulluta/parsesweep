# Solar Ordinances — local-document extraction config
# Usage: pixi run psweep run --config config/solar/run.yaml

domain: solar

models:
  primary: compassop-gpt-4.1
  secondary: compassop-gpt-4.1-mini

extraction:
  model: primary
  input_dir: documents/solar/
  schema: schemas/personal/solar_ordinance_schema.json
  output_dir: extracted/solar/
  max_context: 600000

compilation:
  input_dir: extracted/solar/
  schema: schemas/personal/solar_ordinance_schema.json
  output_dir: compiled/solar/
  normalization:
    # Derive a 5-digit Census county FIPS join key from state + county.
    county_fips: true
  output:
    default_format: both
