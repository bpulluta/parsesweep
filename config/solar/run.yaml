# Solar Ordinances — local-document extraction config
# Usage: pixi run psweep run --config config/solar/run.yaml

domain: solar

models:
  primary: compassop-gpt-4.1
  secondary: compassop-gpt-4.1-mini

extraction:
  model: primary
  max_context: 600000

compilation:
  normalization:
    # Derive a 5-digit Census county FIPS join key from state + county.
    county_fips: true
  output:
    default_format: both
