# Solar Ordinances — local-document extraction config
# Usage: pixi run psweep run --config config/solar/run.yaml

domain: solar

models:
  primary: compassop-gpt-4.1
  secondary: compassop-gpt-4.1-mini

extraction:
  model: primary
  max_context: 600000

compilation:
  normalization:
    state_column: state
    # Derive a 5-digit Census county FIPS join key (county_fips column).
    county_fips: {state: state, county: county}
  output:
    default_format: both
    annotation_column: notes
