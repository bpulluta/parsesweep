# Utility Rate Tariffs — full pipeline config
# Usage: psweep extract --config config/utility_rate_tariffs/run.yaml

domain: utility_rate_tariffs

# Model tiers — cheap/fast for iteration steps, accurate for extraction.
models:
  primary: compassop-gpt-4.1          # extraction (accuracy matters)
  secondary: compassop-gpt-4.1-mini   # discovery, page targeting, review (speed matters)

discovery:
  targets_csv: targets.csv
  queries:
    # Geography + utility brand — finds the most likely official tariff
    - '"{utility_name}" {state} electric tariff filetype:pdf'
    # Geography-first — works even if utility name is wrong or missing
    - '{city} {state} electric utility tariff rate schedule filetype:pdf'
    # PUC/PSC filing search — state regulatory filings for the area
    - '{city} {state} electric utility "service classification" OR "rate schedule" filetype:pdf'
    # Utility name + rate schedule keyword (no state filter — catches state subsidiaries)
    - '"{utility_name}" electric rate schedule "residential" filetype:pdf'
  search:
    provider: serpapi
    max_results: 10
    cache: true
  selection:
    primary_per_target: 20
    exclude_draft: true
    # Relevance pre-filter: must look like tariff content (keyword match in URL/title/snippet)
    relevance_require_any_terms:
      - tariff
      - rate schedule
      - rate book
      - service classification
      - electric rates
      - kWh
      - kwh
      - energy charge
      - customer charge
      - demand charge
      - rate filing
    relevance_exclude_any_terms:
      - press release
      - news article
      - meeting minutes
      - agenda
      - newsletter
      - rebate
      - incentive program
      - rent guideline
      - housing
      - water authority
      - audit committee
      - annual report
      - 10-K
      - SEC filing
      - environmental impact
      - customer notice
      - bill insert
    require_supported_document: false
  document_classifier:
    required_keywords:
      - tariff
      - rate
      - schedule
      - kWh
      - kwh
      - service classification
      - energy charge
      - customer charge
    nice_to_have_keywords:
      - residential
      - monthly charge
      - demand charge
      - per kWh
      - rider
      - fuel adjustment
    min_required_matches: 1
    action: warn
  document_review:
    model: secondary
    document_description: >-
      an official electric tariff book, rate schedule filing, or rate schedule PDF
      for residential and/or commercial customers in {city}, {state}. The filing
      utility may operate under a different legal or subsidiary name than the
      well-known brand — accept any document that is clearly the official electric
      tariff for the {state} service territory that includes {city}. Valid: a
      complete tariff book, a single service classification rate page, or a rate
      summary sheet showing per-kWh energy charges, monthly customer charges, and
      demand rates. REJECT: (1) tariffs for a different state entirely, (2) gas
      tariffs — electric only, (3) bill inserts or customer notices, (4) rebate or
      incentive program documents, (5) meeting minutes, annual reports, SEC
      filings, press releases, (6) housing/rent guidelines, (7) technical
      interconnection or installation guides, (8) long-range planning reports.
    keep_top: 2
    deduplicate_redundant: true
    deduplication:
      key_fields: [path_basename, review_doc_kind]
    action: move
  partition_by: [state, utility_name]
  partition_by: [state, utility_name]

# Skip/reprocess hygiene: extraction skips files with existing output JSON by
# default (skip_existing). Iterate freely without --reprocess; only pass
# --reprocess after changing the schema, model tier, or page targeting.
extraction:
  model: primary                           # pin tier — never silently falls back to
                                           # the .env default if tiers/env change
  input_dir: discovered/utility_rate_tariffs/latest/curated
  schema: schemas/personal/electricity_tariff_schema.json
  output_dir: extracted/utility_rate_tariffs
  max_context: 400000                      # explicit; trigger_chars matches so page
                                           # targeting only fires for docs that would
                                           # be truncated (zero-regression approach)
  pages:                                   # page targeting for large PDFs
    # csv: config/utility_rate_tariffs/page_ranges.csv  # manual ranges win over auto_locate
    auto_locate:                           # LLM fallback for uncovered docs
      model: secondary                     # pin to an alias — avoid silent .env fallback
      section_description: >-
        residential electric rate schedules showing per-kWh energy charges,
        monthly customer charge, and other rate components
      trigger_chars: 400000                # == max_context: only target docs that
                                           # would otherwise be truncated
      max_selected_pages: 30
      keywords:                            # heuristic pre-filter (cheap, before LLM)
        - rate schedule
        - residential
        - energy charge
        - customer charge
        - per kwh
        - service classification
      save_discovered: true                # write discovered ranges for human review

compilation:
  input_dir: extracted/utility_rate_tariffs
  schema: schemas/personal/electricity_tariff_schema.json
  output_dir: compiled/utility_rate_tariffs
  normalization:
    state_column: State
  output:
    default_format: excel
    column_order: [utility_name, state, effective_date, rate_name, is_rider,
      sector, applicable_riders, rate_calculation_formula, charge_type,
      charge_description, rate, unit, season, time_period]
    freeze_columns: 2
    auto_width: true

qaqc:
  models: [primary, secondary]
  comparison_approach: numeric_only
  projection:
    type: nested_array_items
    source_array: rate_schedules
    nested_array: charges
    parent_fields: [rate_name, is_rider, sector]
  record_matching:
    key_fields: [rate_name, charge_type, charge_description, season, time_period]
  comparison:
    primary_fields: [rate, unit]
