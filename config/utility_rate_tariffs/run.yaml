# Utility Rate Tariffs — full pipeline config
# Usage: psweep extract --config config/utility_rate_tariffs/run.yaml

domain: utility_rate_tariffs

# Model tiers — cheap/fast for iteration steps, accurate for extraction.
models:
  primary: compassop-gpt-4.1          # extraction (accuracy matters)
  secondary: compassop-gpt-4.1-mini   # discovery, page targeting, review (speed matters)

discovery:
  targets_csv: targets.csv
  queries:
    # Multiple query templates — each target gets all of them.
    # Variables come from targets.csv columns.
    - '{utility_name} {state} "schedule of rates" electric tariff filetype:pdf'
    - '{utility_name} {state} residential electric rate schedule filetype:pdf'
    - '{city} {state} electric utility tariff "service classification" filetype:pdf'
  search:
    provider: serpapi
    max_results: 10
  selection:
    max_per_target: 3
    require_any: [tariff, rate, schedule, kWh, kwh, service classification]
    exclude: [news, blog, press release, rebate, incentive, program,
              transportation, solar, EV, vehicle, gas]
  follow_links: false
  request_delay_ms: 500
  document_classifier:
    required_keywords: [tariff, rate, schedule, service classification, kWh, kwh]
    nice_to_have_keywords: [residential, monthly charge, energy charge, demand charge]
    min_required_matches: 1
    action: warn
  document_review:
    model: secondary                  # cheap/fast — curation doesn't need 4.1
    document_description: >-
      a utility's official electric tariff book, rate schedule filing, or
      individual rate schedule PDF. Often begins with a table of contents
      listing service classifications, riders, and charges. May also be a
      single rate schedule page showing per-kWh charges, monthly customer
      charges, and demand rates. NOT a customer notice, rebate program,
      transportation plan, or general company information.
    keep_top: 1
    action: move

# Skip/reprocess hygiene: extraction skips files with existing output JSON by
# default (skip_existing). Iterate freely without --reprocess; only pass
# --reprocess after changing the schema, model tier, or page targeting.
extraction:
  model: primary                           # pin tier — never silently falls back to
                                           # the .env default if tiers/env change
  input_dir: discovered/utility_rate_tariffs/latest/curated
  schema: schemas/personal/electricity_tariff_schema.json
  output_dir: extracted/utility_rate_tariffs
  max_context: 400000                      # explicit; trigger_chars matches so page
                                           # targeting only fires for docs that would
                                           # be truncated (zero-regression approach)
  pages:                                   # page targeting for large PDFs
    # csv: config/utility_rate_tariffs/page_ranges.csv  # manual ranges win over auto_locate
    auto_locate:                           # LLM fallback for uncovered docs
      model: secondary                     # pin to an alias — avoid silent .env fallback
      section_description: >-
        residential electric rate schedules showing per-kWh energy charges,
        monthly customer charge, and other rate components
      trigger_chars: 400000                # == max_context: only target docs that
                                           # would otherwise be truncated
      max_selected_pages: 30
      keywords:                            # heuristic pre-filter (cheap, before LLM)
        - rate schedule
        - residential
        - energy charge
        - customer charge
        - per kwh
        - service classification
      save_discovered: true                # write discovered ranges for human review

compilation:
  input_dir: extracted/utility_rate_tariffs
  schema: schemas/personal/electricity_tariff_schema.json
  output_dir: compiled/utility_rate_tariffs
  normalization:
    state_column: State
  output:
    default_format: excel
    column_order: [utility_name, state, effective_date, rate_name, is_rider,
      sector, applicable_riders, rate_calculation_formula, charge_type,
      charge_description, rate, unit, season, time_period]
    freeze_columns: 2
    auto_width: true

qaqc:
  # QA/QC model tiers — reference tiers from the top-level models: block.
  # Must resolve to >= 2 distinct models. Replaces the legacy QAQC_MODELS env var.
  models: [primary, secondary]
  default_lane: quantitative
  lanes:
    quantitative:
      enabled: true
      mode: quantitative
      comparison_approach: numeric_only
      projection:
        type: nested_array_items
        source_array: rate_schedules
        nested_array: charges
        parent_fields: [rate_name, is_rider, sector]
      record_matching:
        key_fields: [rate_name, charge_type, charge_description, season, time_period]
      comparison:
        primary_fields: [rate, unit]
