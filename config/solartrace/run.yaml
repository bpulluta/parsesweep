# SolarTRACE: residential solar permitting requirements per AHJ.
# Usage: pixi run psweep run --config config/solartrace/run.yaml

domain: solartrace

models:
  primary: gpt-6.1-sol      # extraction
  secondary: gpt-5.6-luna   # review, validation challenger
  judge: gpt-5.4-nano       # validation judge

discovery:
  targets: targets.csv      # state, ahj, geo_id; optional `urls` column for known pages
  sources:                  # shared across all targets
    - https://energy-ready.org/communities                       # SolSmart designees
    # SolarAPP+ jurisdictions: the data export can lag, so the live pages are read too
    - https://cdn.prod.website-files.com/688961592e789cad27b033ec/69c142d1a3f4b94b82f219d3_gosolarapp%20-%20locations.csv
    - https://www.gosolarapp.org/where-is-solarapp-available
    - https://www.gosolarapp.org/where-is-solarapp-available?aecaa0d0_page=2
    - https://www.gosolarapp.org/where-is-solarapp-available?aecaa0d0_page=3
    - https://www.gosolarapp.org/where-is-solarapp-available?aecaa0d0_page=4
    - https://www.gosolarapp.org/where-is-solarapp-available?aecaa0d0_page=5
  queries:
    - '"{ahj}" {state} solar permit'
    - '"{ahj}" {state} building inspections'
  search: {max_results: 8, cache: true, params: {udm: web}}   # udm=web: Google honors quotes/site:
  selection: {max_per_target: 8}
  document_review:
    model: secondary
    document_description: >-
      official page or document from the county (AHJ) about permits or inspections
      that apply to residential rooftop solar PV, including general building permit
      pages: submission process or online portal, required documents or engineer
      stamps, fees, inspection types (rough-in, final, virtual), or plan/fire review.
    keep_top: 6
  partition_by: [state, ahj]

extraction:
  model: primary
  max_context: 200000

compilation:
  output:
    default_format: both
    # Output headers: schema titles, roster passthrough columns, then metadata.
    column_order: [State, AHJ Name, geo_id, SolSmart Awardee, Online Permitting,
      Online Instant Permitting, Structural Stamp From Professional Engineer Required,
      Electrical Stamp From Licensed Electrician Required, Third-Party Permitting Available,
      Median Permit Cost, Number of Inspections Required, Rough-In Inspection Required,
      Virtual Inspections Available, Fire Review Required, sources, confidence, evidence]

# Prior survey data, not an exemplar: scored without a min_accuracy gate.
validation:
  models: [secondary]
  references: [samples/ahj_requirements.csv]
  judge: judge
