# Geothermal Ordinances — full pipeline config
# Usage: pixi run psweep run --config config/geothermal_ordinances/run.yaml

domain: geothermal_ordinances

# ── Model tiers ──────────────────────────────────────────────────────────────
models:
  primary: gpt-6.1-sol
  secondary: claude-sonnet-4-6
  judge: gpt-5.4-nano     # validation only

# ── Discovery ────────────────────────────────────────────────────────────────
discovery:
  targets: targets.csv
  crawl:
    # Opt into code-host/API and browser recovery.
    browser_escalation: {enabled: true}
    code_host_adapters: {enabled: true}
  queries:
    - "\"{jurisdiction}\" {state} geothermal ordinance zoning code"
    - "\"{jurisdiction}\" {state} geothermal energy regulation setback permit"
    - "filetype:pdf \"{jurisdiction}\" {state} geothermal ordinance"
    - "site:ecode360.com \"{jurisdiction}\" {state}"
    - "site:municode.com \"{jurisdiction}\" {state} geothermal OR energy"
  search:
    max_results: 10
    cache: true
  selection:
    max_per_target: 15
    exclude_draft: true
    draft_patterns:
      - '\bdraft\b'
      - '\bproposed\b'
      - '\bpreliminary\b'
      - 'for[\s_\-]?review'
      - '\bmodel[\s_\-]ordinance\b'
      - '\bmodel[\s_\-]code\b'
      - '\btemplate\b'
      - '\bsuperseded\b'
      - '\bwithdrawn\b'
      - '\bobsolete\b'
      - '\barchive[d]?\b'
    target_require_any:
      - "{jurisdiction}"
    require_any: [ordinance, zoning, code, chapter, bylaw]
    exclude:
      - press release
      - news article
      - meeting minutes
      - agenda
      - newsletter
      - presentation
      - environmental impact report
      - staff report
    require_supported_document: false
  link_prioritization:
    mode: heuristic
    keywords:
      - geothermal
      - ordinance
      - zoning
      - code
      - setback
      - well
      - energy
      - permit
    domain_scores:
      "ecode360.com": 0.2
      "municode.com": 0.2
      "codepublishing.com": 0.15
      "amlegal.com": 0.2
      ".gov": 0.15
      ".us": 0.15
      ".org": 0.15
  document_classifier:
    required_keywords:
      - ordinance
      - code
      - chapter
      - section
      - regulation
      - division
      - title
      - zoning
    nice_to_have_keywords:
      - geothermal
      - setback
      - permit
      - overlay
      - well
      - energy
    min_required_matches: 2
    action: warn
  document_review:
    model: secondary
    document_description: >-
      enacted county ordinance, land use/zoning code chapter or division,
      or county code section that regulates geothermal electricity generation
      (not geothermal heat pumps, solar, wind, or other technologies).
      Must be the codified/adopted regulation text, not a draft, EIR,
      notice, or planning study. Accept documents that contain:
      (a) quantitative values like setbacks, noise limits, lot sizes, or
      (b) use tables listing geothermal as permitted/conditional use, or
      (c) permit requirements, well spacing rules, or operational standards.
      A document with even a short geothermal section within a broader
      zoning code IS relevant — accept it.
    keep_top: 2
    # Comparative dedup: after individual grading, an LLM pass compares all
    # confirmed-primary docs for the same jurisdiction and drops redundant ones
    # (same ordinance in an older format or from a less authoritative source).
    # Genuinely complementary sections are kept. keep_top still caps the final
    # count of distinct docs per jurisdiction. Default: true.
    deduplicate_redundant: true
  partition_by: [state, jurisdiction]

# ── Extraction ───────────────────────────────────────────────────────────────
# Reuse verifies source/schema/model/scope and record-byte evidence.
# Stale or unverifiable records re-extract automatically. --fresh resets the
# whole resolved output after preflight, rebuilding only selected documents.
extraction:
  model: primary                     # accurate tier — extraction accuracy matters
  max_context: 600000
  timeout_seconds: 600              # 4-6 can exceed default 120s on long code chapters
  pages:                                   # cost control for oversized municipal codes
    auto_locate:                           # only engages for docs that would be truncated
      model: secondary                     # cheap/fast — page finding doesn't need primary
      section_description: >-
        the chapter, division, or code sections regulating geothermal energy —
        setbacks, well spacing/permits, noise limits, lot/overlay standards, and
        permitted/conditional use tables for geothermal electricity generation
      trigger_chars: 600000                # == max_context: only target docs that
                                           # would otherwise be truncated (zero
                                           # regression for docs read in full today)
      max_selected_pages: 40               # generous — geothermal rules may span
                                           # zoning + well-drilling chapters
      keywords:                            # heuristic pre-filter (cheap, pre-LLM)
        - geothermal
        - setback
        - well
        - permit
        - overlay
        - zoning
        - energy
      save_discovered: true                # write discovered ranges for human review

# ── Compilation ──────────────────────────────────────────────────────────────
compilation:
  normalization:
    state_column: state
    # Derive a 5-digit Census county FIPS join key (county_fips column).
    county_fips: {state: state, county: county}
  output:
    default_format: both
    annotation_column: notes
    # Output headers (schema title, else field name).
    exclude_fields:
      - Run Id
      - Artifact Id
      - Error Count
      - Error Categories
      - Error Messages
      - reasoning
    column_order:
      - county
      - state
      - subdivision
      - jurisdiction_type
      - county_fips
      - feature
      - specific_subject
      - applies_to
      - requirement_description
      - value_category
      - value
      - value_interpretation
      - units
      - range_low
      - range_high
      - obligation
      - condition
      - applicable_values
      - source_verbatim
      - summary
      - year
      - section
      - source
      - notes
    freeze_columns: 4
    auto_width: true

# ── Validation ───────────────────────────────────────────────────────────────
validation:
  models: [secondary]
  judge: judge
  key_fields: [state, county, feature, rule_kind, applies_to, specific_subject]
  quote_field: source_verbatim
  fields: [value, units, value_interpretation, obligation]
