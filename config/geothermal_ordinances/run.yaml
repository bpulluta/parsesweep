# Geothermal Ordinances — full pipeline config
# Usage: pixi run psweep run --config config/geothermal_ordinances/run.yaml

domain: geothermal_ordinances

# ── Model tiers ──────────────────────────────────────────────────────────────
models:
  primary: compassop-gpt-4.1
  secondary: compassop-gpt-4.1-mini

# ── Discovery ────────────────────────────────────────────────────────────────
discovery:
  targets_csv: targets.csv
  queries:
    - "filetype:pdf \"{jurisdiction}\" {state} geothermal power plant ordinance"
    - "geothermal electricity generation ordinance \"{jurisdiction}\" {state}"
    - "\"{jurisdiction}\" {state} geothermal energy facility zoning ordinance"
    - "site:ecode360.com \"{jurisdiction}\" {state}"
    - "\"{jurisdiction}\" {state} geothermal power plant land use code"
  search:
    provider: serpapi
    max_results: 10
    cache: true
  selection:
    primary_per_target: 10
    exclude_draft: true
    target_identity_require_any_templates:
      - "{jurisdiction}"
    relevance_require_any_terms:
      - geothermal
      - ordinance
      - zoning
      - code
      - regulation
      - chapter
      - division
      - setback
      - permit
      - well
      - energy
    relevance_exclude_any_terms:
      - press release
      - news article
      - meeting minutes
      - agenda
      - newsletter
      - presentation
      - environmental impact report
      - staff report
    relevance_allowed_domain_patterns:
      - ".gov"
      - ".us"
      - ecode360.com
      - municode.com
      - codepublishing.com
      - ".org"
    require_supported_document: false
  link_prioritization:
    mode: heuristic
    keywords:
      - geothermal
      - ordinance
      - zoning
      - code
      - setback
      - well
      - energy
      - permit
    domain_scores:
      "ecode360.com": 0.2
      "municode.com": 0.2
      "codepublishing.com": 0.15
  document_classifier:
    required_keywords:
      - ordinance
      - code
      - chapter
      - section
      - regulation
      - division
      - title
      - zoning
    nice_to_have_keywords:
      - geothermal
      - setback
      - permit
      - overlay
      - well
      - energy
    min_required_matches: 2
    action: warn
  document_review:
    model: secondary
    document_description: >-
      enacted county ordinance, land use/zoning code chapter or division,
      or county code section that regulates geothermal electricity generation
      (not geothermal heat pumps, solar, wind, or other technologies).
      Must be the codified/adopted regulation text, not a draft, EIR,
      notice, or planning study. Strongly prefer documents that contain
      quantitative regulatory values (setbacks in feet, noise limits in dBA,
      lot sizes in acres, bond amounts in dollars, drilling hours) over
      documents with only qualitative policies or use classifications.
      Accept if it contains ANY regulatory provisions for geothermal energy
      facilities.
    keep_top: 2
    action: move
  partition_by: [state, jurisdiction]

# ── Extraction ───────────────────────────────────────────────────────────────
extraction:
  model: primary
  input_dir: discovered/geothermal_ordinances/curated
  schema: schemas/personal/geothermal_ordinance_schema.json
  output_dir: extracted/geothermal_ordinances
  max_context: 600000

# ── Compilation ──────────────────────────────────────────────────────────────
compilation:
  input_dir: extracted/geothermal_ordinances
  schema: schemas/personal/geothermal_ordinance_schema.json
  output_dir: compiled/geothermal_ordinances
  output:
    default_format: both
    exclude_fields:
      - Run Id
      - Artifact Id
      - Error Count
      - Error Categories
      - Error Messages
      - Applies_To_Geothermal
      - Extraction_Approach
    column_renames:
      State: state
      County: county
      Subdivision: subdivision
      Jurisdiction_Type: jurisdiction_type
      Jurisdiction Type: jurisdiction_type
      Year: year
      Source: source
      Feature: feature
      Value: value
      Units: units
      Adder: adder
      Min Dist: min_dist
      Max Dist: max_dist
      Summary: summary
      Section: section
      Notes: notes
      Fips: FIPS
    column_order:
      - county
      - state
      - subdivision
      - jurisdiction_type
      - FIPS
      - feature
      - value
      - units
      - adder
      - min_dist
      - max_dist
      - summary
      - year
      - section
      - source
      - notes
    freeze_columns: 4
    auto_width: true

# ── QA/QC ────────────────────────────────────────────────────────────────────
qaqc:
  default_lane: quantitative
  lanes:
    quantitative:
      enabled: true
      mode: quantitative
