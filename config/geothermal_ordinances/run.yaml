# Geothermal Ordinances — full pipeline config
# Usage: pixi run psweep run --config config/geothermal_ordinances/run.yaml

domain: geothermal_ordinances

# ── Model tiers ──────────────────────────────────────────────────────────────
models:
  primary: compassop-gpt-4.1
  secondary: compassop-gpt-4.1-mini

# ── Discovery ────────────────────────────────────────────────────────────────
discovery:
  targets_csv: targets.csv
  queries:
    - "\"{jurisdiction}\" {state} geothermal ordinance zoning code"
    - "\"{jurisdiction}\" {state} geothermal energy regulation setback permit"
    - "filetype:pdf \"{jurisdiction}\" {state} geothermal ordinance"
    - "site:ecode360.com \"{jurisdiction}\" {state}"
    - "site:municode.com \"{jurisdiction}\" {state} geothermal OR energy"
  search:
    provider: serpapi
    max_results: 10
    cache: true
  selection:
    primary_per_target: 15
    exclude_draft: true
    target_identity_require_any_templates:
      - "{jurisdiction}"
    relevance_require_any_terms:
      - geothermal
      - ordinance
      - zoning
      - code
      - regulation
      - chapter
      - division
      - setback
      - permit
      - well
      - energy
    relevance_exclude_any_terms:
      - press release
      - news article
      - meeting minutes
      - agenda
      - newsletter
      - presentation
      - environmental impact report
      - staff report
    relevance_allowed_domain_patterns:
      - ".gov"
      - ".us"
      - ecode360.com
      - municode.com
      - codepublishing.com
      - amlegal.com
      - ".org"
    require_supported_document: false
  link_prioritization:
    mode: heuristic
    keywords:
      - geothermal
      - ordinance
      - zoning
      - code
      - setback
      - well
      - energy
      - permit
    domain_scores:
      "ecode360.com": 0.2
      "municode.com": 0.2
      "codepublishing.com": 0.15
      "amlegal.com": 0.2
  document_classifier:
    required_keywords:
      - ordinance
      - code
      - chapter
      - section
      - regulation
      - division
      - title
      - zoning
    nice_to_have_keywords:
      - geothermal
      - setback
      - permit
      - overlay
      - well
      - energy
    min_required_matches: 2
    action: warn
  document_review:
    model: secondary
    document_description: >-
      enacted county ordinance, land use/zoning code chapter or division,
      or county code section that regulates geothermal electricity generation
      (not geothermal heat pumps, solar, wind, or other technologies).
      Must be the codified/adopted regulation text, not a draft, EIR,
      notice, or planning study. Accept documents that contain:
      (a) quantitative values like setbacks, noise limits, lot sizes, or
      (b) use tables listing geothermal as permitted/conditional use, or
      (c) permit requirements, well spacing rules, or operational standards.
      A document with even a short geothermal section within a broader
      zoning code IS relevant — accept it.
    keep_top: 2
    # Comparative dedup: after individual grading, an LLM pass compares all
    # confirmed-primary docs for the same jurisdiction and drops redundant ones
    # (same ordinance in an older format or from a less authoritative source).
    # Genuinely complementary sections are kept. keep_top still caps the final
    # count of distinct docs per jurisdiction. Default: true.
    deduplicate_redundant: true
    action: move
  partition_by: [state, jurisdiction]

# ── Extraction ───────────────────────────────────────────────────────────────
# Skip/reprocess hygiene: `psweep extract` skips files that already have output
# JSON by default (skip_existing). Re-run cheaply after config tweaks without
# --reprocess; only pass --reprocess when you actually changed the schema, model
# tier, or page targeting and want to overwrite existing extractions.
extraction:
  model: primary                     # accurate tier — extraction accuracy matters
  input_dir: discovered/geothermal_ordinances/curated
  schema: schemas/personal/geothermal_ordinance_schema.json
  output_dir: extracted/geothermal_ordinances
  max_context: 600000
  pages:                                   # cost control for oversized municipal codes
    auto_locate:                           # only engages for docs that would be truncated
      model: secondary                     # cheap/fast — page finding doesn't need primary
      section_description: >-
        the chapter, division, or code sections regulating geothermal energy —
        setbacks, well spacing/permits, noise limits, lot/overlay standards, and
        permitted/conditional use tables for geothermal electricity generation
      trigger_chars: 600000                # == max_context: only target docs that
                                           # would otherwise be truncated (zero
                                           # regression for docs read in full today)
      max_selected_pages: 40               # generous — geothermal rules may span
                                           # zoning + well-drilling chapters
      keywords:                            # heuristic pre-filter (cheap, pre-LLM)
        - geothermal
        - setback
        - well
        - permit
        - overlay
        - zoning
        - energy
      save_discovered: true                # write discovered ranges for human review

# ── Compilation ──────────────────────────────────────────────────────────────
compilation:
  input_dir: extracted/geothermal_ordinances
  schema: schemas/personal/geothermal_ordinance_schema.json
  output_dir: compiled/geothermal_ordinances
  output:
    default_format: both
    exclude_fields:
      - Run Id
      - Artifact Id
      - Error Count
      - Error Categories
      - Error Messages
      - Applies_To_Geothermal
      - Extraction_Approach
      - Reasoning
    column_renames:
      State: state
      County: county
      Subdivision: subdivision
      Jurisdiction_Type: jurisdiction_type
      Jurisdiction Type: jurisdiction_type
      Year: year
      Source: source
      Feature: feature
      Specific Subject: specific_subject
      Applies To: applies_to
      Requirement Description: requirement_description
      Value Category: value_category
      Value: value
      Value Interpretation: value_interpretation
      Units: units
      Range Low: range_low
      Range High: range_high
      Obligation: obligation
      Condition: condition
      Applicable Values: applicable_values
      Source Verbatim: source_verbatim
      Summary: summary
      Section: section
      Notes: notes
      Fips: FIPS
    column_order:
      - county
      - state
      - subdivision
      - jurisdiction_type
      - FIPS
      - feature
      - specific_subject
      - applies_to
      - requirement_description
      - value_category
      - value
      - value_interpretation
      - units
      - range_low
      - range_high
      - obligation
      - condition
      - applicable_values
      - source_verbatim
      - summary
      - year
      - section
      - source
      - notes
    freeze_columns: 4
    auto_width: true

# ── QA/QC ────────────────────────────────────────────────────────────────────
qaqc:
  # QA/QC model tiers — reference tiers from the top-level models: block.
  # Must resolve to >= 2 distinct models.
  models: [primary, secondary]
  default_lane: quantitative
  lanes:
    quantitative:
      enabled: true
      mode: quantitative
      comparison_approach: numeric_only
      record_matching:
        # Match records across models by: what type of requirement, what it
        # applies to, and any sub-topic (e.g. "at property line" vs blank).
        key_fields: [feature, applies_to, specific_subject]
      comparison:
        # Compare the extracted value, its units, how to interpret it
        # (minimum/maximum/exact), and the obligation strength.
        primary_fields: [value, units, value_interpretation, obligation]
