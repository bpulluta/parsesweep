# Phase 3A diagnostic — Friendswood TX only, tightened browser escalation.
# Isolated domain/output dirs so production runs are untouched.
# Usage: pixi run psweep discover --config config/natural_gas_pipelines/phase3a_friendswood/run.yaml
#        pixi run psweep extract --config config/natural_gas_pipelines/phase3a_friendswood/run.yaml
#        pixi run psweep compile --config config/natural_gas_pipelines/phase3a_friendswood/run.yaml

domain: natural_gas_pipelines_phase3a

# ── Model tiers ──────────────────────────────────────────────────────────────
models:
  primary: gpt-5.6-terra
  secondary: gpt-5.4-mini
  judge: claude-sonnet-5

# ── Discovery ────────────────────────────────────────────────────────────────
discovery:
  targets_csv: targets.csv
  # Phase 3A: force browser re-render of SPA shells (Municode/eCode360).
  # Measured on the 2026-08-27 Friendswood run:
  #   Municode SPA shells   : 3,278 / 3,415 / 4,216 chars (nav + language picker
  #                           chrome only — zero ordinance text)
  #   Laserfiche viewer shell: 825 chars
  #   Real rendered content : 39,371 / 58,982 / 62,424 chars
  # The 200-char default caught only a hard "Bad Gateway" page (164 chars), so
  # every Municode shell passed through unrendered. 8000 sits well above the
  # largest observed shell and far below the smallest real document.
  browser_escalation:
    enabled: true
    min_shell_chars: 8000
    min_rendered_chars: 10000
    settle_seconds: 20
  queries:
    # General ordinance searches (100% hit rate, ~9 results each)
    - "\"{jurisdiction}\" {state} natural gas compressor station ordinance"
    # Restore: Catches municipalities that regulate NG compressor stations within
    # broader "oil and gas operations" chapters (e.g., PA, MA). LLM extraction
    # correctly identifies NG-specific rules; URL filters prevent noise.
    - "\"{jurisdiction}\" {state} oil and gas facilities zoning ordinance"
    - "\"{jurisdiction}\" {state} compressor station setback noise ordinance code"
    # Catches dedicated gas-well ordinances that include NG compressor/pipeline provisions
    # (e.g., Keller TX Gas Well Ordinance explicitly references compressors and pipelines).
    - "\"{jurisdiction}\" {state} gas well ordinance compressor pipeline"
    # Code-hosting site searches (find landing pages for municode/ecode360)
    - "site:ecode360.com \"{jurisdiction}\" {state}"
    - "site:municode.com \"{jurisdiction}\" {state} code of ordinances"
    # Texas jurisdictions often place compressor/pipeline controls inside broader
    # UDC/gas-well chapters; keep this for discovery recall, then filter in review.
    - "\"{jurisdiction}\" {state} unified development code gas well compressor station"
  search:
    provider: serpapi
    max_results: 10
    cache: true
  selection:
    # When follow_links is enabled, set high to ensure HTML landing pages
    # (which sort below PDFs) reach the digger. Document review keep_top
    # is the real output gatekeeper.
    primary_per_target: 40
    exclude_draft: true
    # Hard filter: candidate URL/title/snippet MUST mention the jurisdiction
    target_identity_require_any_templates:
      - "{jurisdiction}"
    # Minimal relevance filter: just needs to look like legal/government content
    # (the digger + document review handle topic relevance)
    relevance_require_any_terms:
      - ordinance
      - zoning
      - code
      - compressor
      - pipeline
      - natural gas
      # Restore: These keywords catch mixed O&G/NG ordinances that contain NG rules
      - oil and gas
      - gas well
      - gas facilities
      - gas utility
      - bylaw
      - chapter
      - title
    relevance_exclude_any_terms:
      - press release
      - news article
      - meeting minutes
      - agenda
      - newsletter
      - presentation
      - public comment
      - staff report
      - environmental impact
      - handbook
      - technical report
      - research report
      - law review
      - jobs
    exclude_url_patterns:
      - "indeed\\.com/"
      - "digitalcommons\\.law\\."
      - "ir\\.lawnet\\."
      - "scholarship\\.law\\."
      - "hklaw\\.com/"
      - "townhall\\.virginia\\.gov/"
      - "wikipedia\\.org/"
      - "nasa\\.gov/"
      - "lincolninst\\.edu/"
      - "agrilife\\.org/"
      - "rosap\\.ntl\\.bts\\.gov/"
      - "facebook\\.com/"
      - "twitter\\.com/"
      - "x\\.com/"
      - "insideclimatenews\\.org/"
    relevance_allowed_domain_patterns:
      - ".gov"
      - ".us"
      - municode.com
      - ecode360.com
      - codepublishing.com
      - generalcode.com
      - zoneomics.com
      - ".org"
    require_supported_document: false
  # ── Digger (link-following) ──
  # Available but disabled by default — browser crawling is too slow for scale.
  # Enable per-target with seeds when SerpApi misses a jurisdiction's code.
  # follow_links: true
  # digger:
  #   provider: http
  #   discovery_rules:
  #     include_link_text_patterns:
  #       - "compressor"
  #       - "natural gas"
  #       - "pipeline"
  #       - "gas facilit"
  runtime:
    max_depth: 3
    max_pages: 40
  retention:
    documents: curated
  link_prioritization:
    mode: heuristic
    keywords:
      - compressor
      - pipeline
      - natural gas
      - ordinance
      - zoning
      - code
      - setback
      - gas facilities
    domain_scores:
      "municode.com": 0.2
      "ecode360.com": 0.2
      "codepublishing.com": 0.15
      "generalcode.com": 0.15
      "amlegal.com": 0.2
  document_classifier:
    required_keywords:
      - ordinance
      - code
      - chapter
      - section
      - regulation
      - zoning
      - permitted
      - conditional
      - bylaw
    nice_to_have_keywords:
      - compressor
      - pipeline
      - natural gas
      - setback
      - noise
      - permit
      - gas facilities
      - gas utility
      # Restore: Keywords for mixed O&G/NG ordinances that contain NG compressor rules
      - oil and gas
      - gas well
    min_required_matches: 1
    action: warn
  document_review:
    model: primary
    document_description: >-
      enacted municipal or county ordinance, zoning code chapter, bylaw, or
      code of ordinances section that regulates natural gas compressor stations,
      natural gas pipelines (transmission, distribution, gathering), or
      metering/regulator stations.
      Strongly prefer documents with quantitative setback values (feet) and
      noise limits (dBA) over documents with only qualitative standards or
      monitoring protocols.
      Relevant content includes: setbacks, noise limits, zoning district
      requirements, permit conditions, fencing heights, enclosures. Reject only:
      drafts, meeting minutes, staff reports, news articles, environmental
      impact reports, state-level regulations, or documents from a different
      jurisdiction than the target. EXCLUDE oil and gas well siting/drilling/
      production regulations and wellpad requirements unless a clause explicitly
      governs natural gas compressor stations or pipelines. If a jurisdiction's
      only available ordinance artifact is a mixed UDC/gas-well chapter that
      includes explicit compressor/pipeline standards, treat it as primary for
      this workflow (we will extract only compressor/pipeline requirements and
      ignore unrelated well-development clauses).
    keywords:
      - natural gas
      - compressor
      - pipeline
      - metering
      - regulator station
      - setback
      - feet
      - dba
      - fence
      - zoning
    keep_top: 3
    # Comparative dedup: after individual grading, an LLM pass compares all
    # confirmed-primary docs for the same jurisdiction and drops redundant ones
    # (same ordinance in an older format or from a less authoritative source).
    # Genuinely complementary sections are kept. keep_top still caps the final
    # count of distinct docs per jurisdiction. Default: true.
    deduplicate_redundant: true
    action: move
  partition_by: [state, jurisdiction]

# ── Extraction ───────────────────────────────────────────────────────────────
extraction:
  model: primary
  input_dir: discovered/natural_gas_pipelines_phase3a/latest/curated
  schema: schemas/personal/natural_gas_pipeline_schema.json
  output_dir: extracted/natural_gas_pipelines_phase3a
  max_context: 600000
  timeout_seconds: 600
  pages:
    auto_locate:
      model: secondary
      section_description: >-
        the ordinance sections regulating natural gas compressor stations and
        pipelines — setback distances from property lines, roads, water bodies,
        and sensitive uses; noise dBA limits; and fencing height requirements
      trigger_chars: 100000
      max_selected_pages: 40
      keywords:
        - natural gas
        - compressor
        - pipeline
        - setback
        - noise
        - fencing
        - dBA
        - distance
      save_discovered: true

# ── Compilation ──────────────────────────────────────────────────────────────
compilation:
  input_dir: extracted/natural_gas_pipelines_phase3a
  schema: schemas/personal/natural_gas_pipeline_schema.json
  output_dir: compiled/natural_gas_pipelines_phase3a
  provenance_policy: fail
  output:
    default_format: both
    freeze_columns: 4
    auto_width: true
    exclude_fields:
      - Run Id
      - Artifact Id
      - Error Count
      - Error Categories
      - Error Messages
      - Applies_To_Natural_Gas
      - Extraction_Approach
      - Reasoning
      # Always-null in current dataset — keep in schema for edge cases, drop from output
      - Subdivision
      - subdivision
      - Range Low
      - range_low
      - Range High
      - range_high
      - Applicable Values
      - applicable_values
    # column_renames: auto-derived from schema property names (snake_case). Add overrides only.
    column_renames:
      Fips: FIPS
    # column_order: priority prefix only — remaining schema fields follow in declaration order
    column_order:
      - state
      - county
      - jurisdiction_type
      - year

