# Natural Gas Pipelines & Compressor Stations — full pipeline config
# Usage: pixi run psweep discover --config config/natural_gas_pipelines/run.yaml
#        pixi run psweep extract --config config/natural_gas_pipelines/run.yaml
#        pixi run psweep compile --config config/natural_gas_pipelines/run.yaml

domain: natural_gas_pipelines

# ── Model tiers ──────────────────────────────────────────────────────────────
models:
  primary: compassop-gpt-4.1           # extraction (accuracy-critical)
  secondary: compassop-gpt-4.1-mini    # discovery review, page targeting (speed/cost)

# ── Discovery ────────────────────────────────────────────────────────────────
discovery:
  targets_csv: targets.csv
  queries:
    # General ordinance searches (100% hit rate, ~9 results each)
    - "\"{jurisdiction}\" {state} natural gas compressor station ordinance"
    - "\"{jurisdiction}\" {state} oil and gas facilities zoning ordinance"
    - "\"{jurisdiction}\" {state} compressor station setback noise ordinance code"
    # Code-hosting site searches (find landing pages for municode/ecode360)
    - "site:ecode360.com \"{jurisdiction}\" {state}"
    - "site:municode.com \"{jurisdiction}\" {state} code of ordinances"
  search:
    provider: serpapi
    max_results: 10
    cache: true
  selection:
    # When follow_links is enabled, set high to ensure HTML landing pages
    # (which sort below PDFs) reach the digger. Document review keep_top
    # is the real output gatekeeper.
    primary_per_target: 40
    exclude_draft: true
    # Hard filter: candidate URL/title/snippet MUST mention the jurisdiction
    target_identity_require_any_templates:
      - "{jurisdiction}"
    # Minimal relevance filter: just needs to look like legal/government content
    # (the digger + document review handle topic relevance)
    relevance_require_any_terms:
      - ordinance
      - zoning
      - code
      - compressor
      - pipeline
      - natural gas
      - oil and gas
      - gas well
      - gas facilities
      - gas utility
      - bylaw
      - chapter
      - title
    relevance_exclude_any_terms:
      - press release
      - news article
      - meeting minutes
      - agenda
      - newsletter
      - presentation
      - public comment
      - staff report
      - environmental impact
    relevance_allowed_domain_patterns:
      - ".gov"
      - ".us"
      - municode.com
      - ecode360.com
      - codepublishing.com
      - generalcode.com
      - zoneomics.com
      - ".org"
    require_supported_document: false
  # ── Digger (link-following) ──
  # Available but disabled by default — browser crawling is too slow for scale.
  # Enable per-target with seeds when SerpApi misses a jurisdiction's code.
  # follow_links: true
  # digger:
  #   provider: http
  #   discovery_rules:
  #     include_link_text_patterns:
  #       - "compressor"
  #       - "natural gas"
  #       - "oil and gas"
  #       - "pipeline"
  #       - "gas facilit"
  runtime:
    max_depth: 3
    max_pages: 40
  link_prioritization:
    mode: heuristic
    keywords:
      - compressor
      - pipeline
      - natural gas
      - oil and gas
      - ordinance
      - zoning
      - code
      - setback
      - gas well
      - gas facilities
    domain_scores:
      "municode.com": 0.2
      "ecode360.com": 0.2
      "codepublishing.com": 0.15
      "generalcode.com": 0.15
  document_classifier:
    required_keywords:
      - ordinance
      - code
      - chapter
      - section
      - regulation
      - zoning
      - permitted
      - conditional
      - bylaw
    nice_to_have_keywords:
      - compressor
      - pipeline
      - natural gas
      - setback
      - noise
      - permit
      - oil and gas
      - gas well
      - gas facilities
      - gas utility
    min_required_matches: 1
    action: warn
  document_review:
    model: secondary
    document_description: >-
      enacted municipal or county ordinance, zoning code chapter, bylaw, or
      code of ordinances section that regulates natural gas compressor stations,
      natural gas pipelines, oil and gas facilities, or gas utility infrastructure.
      Relevant content includes: setbacks, noise limits, zoning district
      requirements, permit conditions, fencing, enclosures, or even just listing
      compressor stations or pipelines as a permitted/conditional/special use
      in a zoning district. Accept the document if it contains ANY regulatory
      provisions for natural gas or oil and gas facilities, even if it only
      shows use classifications without detailed setback numbers. Reject only:
      drafts, meeting minutes, staff reports, news articles, environmental
      impact reports, state-level regulations, or documents from a different
      jurisdiction than the target.
    keep_top: 2
    action: move
  partition_by: [state, jurisdiction]

# ── Extraction ───────────────────────────────────────────────────────────────
extraction:
  model: primary
  input_dir: discovered/natural_gas_pipelines/curated
  schema: schemas/personal/natural_gas_pipeline_schema.json
  output_dir: extracted/natural_gas_pipelines
  max_context: 600000

# ── Compilation ──────────────────────────────────────────────────────────────
compilation:
  input_dir: extracted/natural_gas_pipelines
  schema: schemas/personal/natural_gas_pipeline_schema.json
  output_dir: compiled/natural_gas_pipelines
  output:
    default_format: both
    freeze_columns: 4
    auto_width: true
    exclude_fields:
      - Run Id
      - Artifact Id
      - Error Count
      - Error Categories
      - Error Messages
    column_renames:
      State: state
      County: county
      Subdivision: subdivision
      Jurisdiction_Type: jurisdiction_type
      "Jurisdiction Type": jurisdiction_type
      Fips: FIPS
      Year: year
      Source: source
      Feature: feature
      Value: value
      Units: units
      Adder: adder
      "Min Dist": min_dist
      "Max Dist": max_dist
      Summary: summary
      Section: section
      Notes: notes
    column_order:
      - county
      - state
      - subdivision
      - jurisdiction_type
      - FIPS
      - feature
      - value
      - units
      - adder
      - min_dist
      - max_dist
      - summary
      - year
      - section
      - source
      - notes

# ── QA/QC ────────────────────────────────────────────────────────────────────
qaqc:
  default_lane: quantitative
  lanes:
    quantitative:
      enabled: true
      mode: quantitative
