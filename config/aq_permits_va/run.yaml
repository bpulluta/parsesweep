# Virginia Title V air-quality permits (browser crawl)
#
# The DEQ site is behind Akamai edge bot-protection, which 403s any non-browser
# HTTP client (requests, curl) — even with transplanted cookies (Akamai also
# fingerprints TLS). The permit links are DNN "showpublisheddocument" URLs with
# no file extension. So this config:
#   - seeds the public index page,
#   - crawls it with a real headless Chrome (digger.provider: selenium),
#   - treats showpublisheddocument links as documents (include_url_patterns),
#   - downloads each PDF THROUGH the browser (browser_mode: true).
#
# Nothing here is VA-specific in code — any bot-protected, extension-less
# document site works by changing the seed URL + include_url_patterns.
#
# Requires Selenium + Google Chrome.
#   psweep discover --config config/aq_permits_va/run.yaml

domain: aq_permits_va

# Model tiers — accurate for extraction, fast/cheap for review + QA/QC contrast.
models:
  primary: compassop-gpt-4.1          # extraction (accuracy matters)
  secondary: compassop-gpt-4.1-mini   # QA/QC contrast model (speed/cost)

discovery:
  seeds:
    - "https://www.deq.virginia.gov/news-info/shortcuts/permits/air/issued-title-v-permits"

  follow_links: true          # crawl the index (distributed topology)
  browser_mode: true          # real browser for crawl + download (Akamai)

  digger:
    provider: selenium
    allowed_domains: ["deq.virginia.gov"]
    discovery_rules:
      # Permit links carry no .pdf extension; match the DNN document path.
      include_url_patterns: ["showpublisheddocument"]

  runtime:
    max_depth: 1              # index page -> permit links
    max_pages: 3
    max_files: 5             # a few permits, to test
    min_request_interval_ms: 1000

  document_classifier:
    required_keywords: ["permit", "emission", "title v"]
    min_required_matches: 1
    action: warn

extraction:
  # Curated set from the latest discover run (all downloads when no
  # document_review is configured for this domain).
  input_dir: discovered/aq_permits_va/latest/curated
  schema: schemas/personal/air_quality_permits_schema.json
  output_dir: extracted/aq_permits_va
  # OCR-artifact corrections for scanned air-emissions permits. Applied in order
  # to OCR-derived PDF text only. These are domain-specific (emissions units,
  # chemical formulas, manufacturer names); other domains simply omit this block.
  ocr_corrections:
    # Capital O -> C at a word start (Oarbon -> Carbon).
    - {pattern: '\bO([aeiou][a-z]+)', replacement: 'C\1'}
    # Split run-together CamelCase technical terms (SulfurDioxide -> Sulfur Dioxide).
    - {pattern: '\b([A-Z][a-z]+)([A-Z][a-z]+(?:[A-Z][a-z]+)*)\b', replacement: '\1 \2'}
    # ^ -> / in rate units (tons^yr -> tons/yr).
    - {pattern: '(lbs|tons)\^(hr|yr)', replacement: '\1/\2'}
    # ^ -> 2 in chemical formulas (NO^ -> NO2, SO^ -> SO2).
    - {pattern: '([A-Z]{1,2})\^', replacement: '\g<1>2'}
    # I -> l in unit abbreviations (Ibs -> lbs).
    - {pattern: '\bIbs\b', replacement: 'lbs'}
    # O/0 confusion in particulate codes (PM-IO -> PM-10).
    - {pattern: 'PM-I([O0])', replacement: 'PM-10'}
    - {pattern: 'PM-([O0])', replacement: 'PM-0'}
    # b -> h in time units (lbs/br -> lbs/hr).
    - {pattern: '(lbs|tons)/br\b', replacement: '\1/hr'}
    # Run-together words common in emissions permits.
    - {pattern: 'Caterpillardiesel', replacement: 'Caterpillar diesel', ignore_case: true}
    - {pattern: 'hoursperyear', replacement: 'hours per year', ignore_case: true}
    - {pattern: 'peryear', replacement: 'per year', ignore_case: true}
    - {pattern: 'perhour', replacement: 'per hour', ignore_case: true}
    - {pattern: 'dieselpowered', replacement: 'diesel powered', ignore_case: true}
    - {pattern: 'diesel-powered', replacement: 'diesel powered', ignore_case: true}
    - {pattern: 'gaspowered', replacement: 'gas powered', ignore_case: true}
    - {pattern: 'gas-powered', replacement: 'gas powered', ignore_case: true}
    - {pattern: 'Emissionsfrom', replacement: 'Emissions from', ignore_case: true}
    - {pattern: 'Emissionsto', replacement: 'Emissions to', ignore_case: true}
    # Chemical compound fragments and formula spacing.
    - {pattern: 'Oioxide', replacement: 'Dioxide'}
    - {pattern: 'Oompounds', replacement: 'Compounds'}
    - {pattern: '\(asNO2\)', replacement: '(as NO2)'}
    - {pattern: '\(asSO2\)', replacement: '(as SO2)'}
    # Space between a numeric value and its rate unit (4.20lbs/hr -> 4.20 lbs/hr).
    - {pattern: '(\d+\.?\d*)([a-z]+/[a-z]+)', replacement: '\1 \2', ignore_case: true}

compilation:
  input_dir: extracted/aq_permits_va
  schema: schemas/personal/air_quality_permits_schema.json
  output_dir: compiled/aq_permits_va

validation:
  models: [primary, secondary]
  comparison_approach: numeric_only
  record_matching:
    key_fields:
      - referenceNumber
      - make
      - model
  comparison:
    primary_fields:
      - ratedCapacityKW
      - ratedCapacityBHP
      - ratedCapacityHP
      - ratedCapacityMMBtuPerHr
      - operatingHoursPerUnitLimit
      - operatingHoursCombinedLimit
      - numGenerators
