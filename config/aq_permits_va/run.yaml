# Virginia Title V air-quality permits (browser crawl)
#
# The DEQ site is behind Akamai edge bot-protection, which 403s any non-browser
# HTTP client (requests, curl) — even with transplanted cookies (Akamai also
# fingerprints TLS). The permit links are DNN "showpublisheddocument" URLs with
# no file extension. So this config:
#   - seeds the public index page,
#   - crawls it with a real headless Chrome (digger.provider: selenium),
#   - treats showpublisheddocument links as documents (include_url_patterns),
#   - downloads each PDF THROUGH the browser (browser_mode: true).
#
# Nothing here is VA-specific in code — any bot-protected, extension-less
# document site works by changing the seed URL + include_url_patterns.
#
# Requires Selenium + Google Chrome.
#   psweep discover --config config/aq_permits_va/run.yaml

domain: aq_permits_va

discovery:
  seeds:
    - "https://www.deq.virginia.gov/news-info/shortcuts/permits/air/issued-title-v-permits"

  follow_links: true          # crawl the index (distributed topology)
  browser_mode: true          # real browser for crawl + download (Akamai)

  digger:
    provider: selenium
    allowed_domains: ["deq.virginia.gov"]
    discovery_rules:
      # Permit links carry no .pdf extension; match the DNN document path.
      include_url_patterns: ["showpublisheddocument"]

  runtime:
    max_depth: 1              # index page -> permit links
    max_pages: 3
    max_files: 5             # a few permits, to test
    min_request_interval_ms: 1000

  document_classifier:
    required_keywords: ["permit", "emission", "title v"]
    min_required_matches: 1
    action: warn

extraction:
  # Curated set from the latest discover run (all downloads when no
  # document_review is configured for this domain).
  input_dir: discovered/aq_permits_va/latest/curated
  schema: schemas/domain_packs/aq_permits/pack.yaml
  output_dir: extracted/aq_permits_va

compilation:
  input_dir: extracted/aq_permits_va
  schema: schemas/domain_packs/aq_permits/pack.yaml
  output_dir: compiled/aq_permits_va
