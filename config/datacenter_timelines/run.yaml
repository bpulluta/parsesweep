# Data Center Project Timelines
#
# Enriches a data-center site list with project LIFECYCLE dates by finding
# news articles, press releases, permits, and filings for each site — and
# recording the SOURCE URL each fact came from (citation_urls).
#
# Temporal model (v2): a FACT and a FORECAST are separate fields —
#   date_announced -> date_construction_start -> date_operational (ACTUAL go-live)
#   with date_expected_completion holding the PROJECTED opening when not yet live,
#   and date_cancelled (killed pre-build) / date_decommissioned (retired post-op)
#   as mutually-exclusive terminal dates. Every date carries a precision
#   (day/month/quarter/year). Chronology is advisory, never forced.
#
# Design notes (this domain is web-article-centric, unlike the PDF domains):
#   - Discovery uses the SerpApi SEEKER, not the crawl digger. The HTTP crawl
#     digger only stages URLs that end in a file extension, so it silently skips
#     extension-less news/press URLs. The seeker downloads the article HTML
#     directly (saved as .html, which the extractor reads).
#   - selection.require_supported_document: false is REQUIRED so HTML pages
#     (no .pdf/.docx extension) survive candidate selection.
#   - No document_review here: its built-in reviewer prompt down-ranks news
#     items, but news/press releases are our PRIMARY source. So curated/ keeps
#     every download and precision is enforced at extraction time via the
#     schema's is_about_query_subject relevance flag + the injected CONTEXT
#     block (SOURCE_URL / QUERIED_SITE) that anchors each extraction to the
#     intended project. This is the "recall first, then flag" principle.
#
# Required env: SERPAPI_KEY (+ Azure OpenAI for process)
# Usage:
#   psweep discover --config config/datacenter_timelines/run.yaml --dry-run
#   psweep discover --config config/datacenter_timelines/run.yaml
#   psweep extract --config config/datacenter_timelines/run.yaml
#   psweep compile --config config/datacenter_timelines/run.yaml

domain: datacenter_timelines

# ── Model tiers ──────────────────────────────────────────────────────────────
models:
  primary: compassop-gpt-4.1           # extraction (accuracy-critical)
  secondary: compassop-gpt-4.1-mini    # discovery review, page targeting (speed/cost)

# COST CONTROL (optional): each LLM stage accepts a `model:` naming the model to
# use (else it inherits the environment-configured model). See extraction.model
# and compilation.synthesis.model below.

discovery:
  # Stratified validation set: 3 sites per stage (operational / planned /
  # construction / in_doubt / decommissioned / withdrawn) sampled from
  # test-v1/baxtel_sites_20250915.csv, preferring notable operators.
  targets_csv: targets_sample.csv

  # SOURCE STRATEGY — lifecycle-focused queries WITHOUT noisy MW capacity term.
  # FINDINGS from v1→v2 iteration (2026-07-22):
  #   - "{demand_capacity_mw} MW" caused massive noise (Fed Reserve, Spanish PDFs)
  #   - Making {city?} optional fixes Meta/rural sites with no city
  #   - Baxtel directory pages scored highest (structured "year built" data)
  #   - Industry press (DCD, DCK, DCF) are second-best lifecycle sources
  #   - 5 query tiers give 83% temporal-content hit rate on test set
  #
  # STRATEGY: 5 complementary query tiers (from best→broadest):
  #   1. Construction/operational status (best performer in v1)
  #   2. Announcement/groundbreaking with quoted phrases
  #   3. Data-center directories (baxtel, datacentermap) — structured dates
  #   4. Project timeline/permit/approval angle
  #   5. Industry trade press (DCD, DCF, DCK) — lifecycle coverage
  queries:
    # Tier 1: Construction & operational status (best performer from v1)
    - "{company_name} {state} {city?} data center construction OR completion OR operational OR \"now online\""
    # Tier 2: Announcement/groundbreaking with tighter phrasing
    - "{company_name} {state} {city?} data center \"announced\" OR \"broke ground\" OR \"groundbreaking\" OR \"plans to build\""
    # Tier 3: Directory/structured-data sources (carry "year built" and timelines)
    - "\"{site_name}\" data center baxtel OR datacentermap OR datacenterhawk"
    # Tier 4: Timeline, permits, and regulatory filings
    - "{company_name} {state} {city?} data center timeline OR permit OR \"expected to open\" OR \"target completion\""
    # Tier 5: Industry news with lifecycle keywords
    - "{company_name} {state} {city?} data center site:datacenterdynamics.com OR site:datacenterfrontier.com OR site:datacenterknowledge.com"
    # Tier 6: Project-name anchored announcement recall (helps older/ambiguous sites)
    - "\"{site_name}\" {company_name?} data center \"announced\" OR \"plans to build\" OR proposed OR unveiled"
    # Tier 7: Local-government records for dated approvals / withdrawals
    - "{company_name} {city?} {state} data center \"special use permit\" OR rezoning OR \"planning commission\" OR \"board of supervisors\" site:.gov"

  search:
    provider: serpapi
    max_results: 10
    cache: true          # cache results so re-running discover doesn't re-pay
    # FINDING (2026-07-21): the Google News vertical (tbm=nws) had poor recall —
    # only 3/18 sites got any hit (it favors very recent news + misses specific
    # facility names / older projects). ORGANIC discovery finds far more news AND
    # press AND directory pages; its only problem was noise PDFs, now removed by
    # the exclude classes below. So we discover organically and filter for
    # precision, rather than restrict the vertical. Flip to true only for a
    # recency-biased news-refresh pass.
    google_news: false

  # Seeker only — do NOT crawl (see design notes above).
  follow_links: false

  # Plain HTTP downloads run in parallel (fast). Set true only if a target's
  # sources are bot-protected (serial through headless Chrome, much slower).
  browser_mode: false

  selection:
    max_per_target: 10           # bump for 7 query tiers while keeping costs bounded
    require_supported_document: false   # KEY: allow extension-less HTML news pages
    target_identity_require_any_templates:
      - "{site_name}"
      - "{city}"
      - "{company_name}"
    # Drop facility spec/cut sheets (they carry no dates) and pure non-content
    # pages. NOTE: data-center DIRECTORIES (baxtel, datacentermap,
    # datacenterHawk) are deliberately NOT excluded — they are our best source
    # of structured "Year Built" + facility history for these existing sites.
    # Matched against candidate URL + seeker reasons BEFORE download, so this is
    # the cheap place to remove whole domain CLASSES that never carry a project
    # lifecycle date. We exclude by class (not per-city) to stay scalable: the
    # same list is correct for any target set. Broad discovery still surfaces the
    # news/press/directory/permit sources we want.
    exclude:
      # -- Facility spec / cut sheets and other static operator PDFs --
      - "cutsheet"
      - "cut-sheet"
      - "cut_sheet"
      - "shipping-receiving"
      - "spec-sheet"
      - "datasheet"
      # -- Non-content / social pages --
      - "/login"
      - "/signin"
      - "/careers"
      - "/careers/"
      - "careers."
      - "/privacy"
      - "/terms"
      - "/contact"
      - "/jobs/"
      - "youtube.com"
      - "facebook.com"
      - "twitter.com"
      - "x.com/"
      - "linkedin.com"
      - "instagram.com"
      # -- Job sites (no project dates) --
      - "ziprecruiter.com"
      - "indeed.com"
      - "glassdoor.com"
      - "jobs."
      # -- Academic / research papers & datasets (no project dates, often huge) --
      - ".edu"
      - ".ac."
      - "researchgate"
      - "ssrn"
      - "arxiv"
      - "semanticscholar"
      - "dokumen.pub"
      - "academia.edu"
      - "sciencedirect"
      - "springer"
      - "ieee.org"
      - "acm.org"
      - "eric.ed.gov"
      - "akademperiodyka"
      - "informatik"
      - "nlp."
      - "downloads.cs."
      - "publications.anl"
      - "anl.gov"
      - "iaea.org"
      - "igs.org"
      # -- Government science / statistics / legislative (NOT permit bodies) --
      - "congress.gov"
      - "senate.gov"
      - "census.gov"
      - "govinfo.gov"
      - "noaa.gov"
      - "nasa.gov"
      - "climate.gov"
      - "science.gov"
      - "fraser.stlouisfed.org"
      - "nepis.epa.gov"
      # -- Finance / investor relations / market data --
      - "sec.gov"
      - "crunchbase"
      - "q4cdn"
      - "deutsche-boerse"
      - "dadavidson"
      - "finance.yahoo"
      - "seekingalpha"
      - "marketwatch"
      - "investor."
      # -- Noise domains observed in v1 dry-run (2026-07-22) --
      - "ugr.es"
      - "usmodernist.org"
      - "hartenergy.com"
      - "kewi.go.ke"
      - "mdpi-res.com"
      - "imetsociety.org"
      - "arataumodular.com"
      - "semiconductor-today.com"
      - "ijmer"
      - "s3-ap-southeast"
      - "corpdata"
      - "pdfs.hartenergy"
      # -- Policy think-tanks / advocacy datasets --
      - "cgdev.org"
      - "greenpolicyplatform"
      - "votesolar"
      - "ourenergypolicy"
      - "mediajustice"
      - "nairrpilot"
      # -- Large irrelevant PDFs discovered in v2 run --
      - "media.datacenterdynamics.com"   # full magazine issues, not articles
      - "abcnhvt.org"
      - "mountain-valley-pipeline"
      - "ag.ny.gov"
      - "cdn.prod.website-files.com"     # generic CDN hosting off-topic docs
      # -- Huge irrelevant PDFs observed in v2 run (2026-07-22) --
      - "media.datacenterdynamics.com"   # Full magazine PDFs (37MB+)
      - "abcnhvt.org"                   # Construction association magazines
      - "mountain-valley-pipeline"       # Pipeline EAs, not data centers
      - "ag.ny.gov"                      # Attorney general settlements
      - "cdn.prod.website-files.com"     # Generic CDN hosting large unrelated PDFs

  request_delay_ms: 800

extraction:
  model: primary
  # Curated set from the latest discover run (all downloads — no document_review).
  input_dir: discovered/datacenter_timelines/latest/curated
  schema: schemas/personal/datacenter_timelines_schema.json
  output_dir: extracted/datacenter_timelines

  # News/press pages are small and extract whole. But permits, planning packets,
  # and regulatory filings can be hundreds of pages — extracting them in full is
  # the main cost driver and dilutes the signal. Page targeting LLM-locates just
  # the pages that state a lifecycle date for THIS facility and extracts only
  # those. Only triggers for docs whose text exceeds trigger_chars, so small
  # HTML/news is untouched. Domain-neutral: the same mechanism serves any domain.
  pages:
    auto_locate:
      # model: <cheaper-model>   # optional: cheaper model for the locator call
      section_description: >-
        the passage(s) that state WHEN this specific data-center facility/project
        reached a lifecycle milestone — when it was announced/proposed, when
        construction/groundbreaking occurred or is scheduled, when it opened /
        became operational / was completed, its expected completion date, or when
        it was cancelled or decommissioned. Not general company background,
        financials, environmental-impact boilerplate, tables of contents, or
        unrelated projects.
      keywords:
        - "data center"
        - "data centre"
        - "datacenter"
        - "groundbreaking"
        - "broke ground"
        - "construction"
        - "operational"
        - "completion"
        - "announced"
        - "approved"
        - "permit"
        - "megawatt"
        - "MW"
      trigger_chars: 60000     # ~15+ pages of text -> target instead of full read
      max_selected_pages: 12

compilation:
  input_dir: extracted/datacenter_timelines
  schema: schemas/personal/datacenter_timelines_schema.json
  output_dir: compiled/datacenter_timelines

  # SYNTHESIS — reconcile the many per-document extraction records into ONE row
  # per entity (conflict resolution + confidence + provenance), instead of lossy
  # tabular dedup. This stage is DOMAIN-NEUTRAL: every key below is a path into
  # the extraction payload and any set of fields can be reconciled. Timelines are
  # just this configuration; the same stage reconciles permit limits, spec
  # values, prices, etc. Runs on `compile` and reuses the `extract` LLM.
  synthesis:
    model: primary
    enabled: true
    # COST CONTROL. Only pay for an LLM reconciliation call when >= this many
    # sources carry a value to reconcile. 0 sources -> null row; 1 source -> its
    # own values (both resolved deterministically, NO API call). Reconciliation
    # only needs the LLM when sources actually disagree. Raise to spend less.
    min_sources_for_llm: 2
    # Optional: name the model for reconciliation (else inherits the env model).
    # Reconciliation is a reasoning task, so a stronger model is usually worth it.
    # model: <stronger-model>
    # One output row per distinct value of this entity key (payload path).
    group_by: ["query_subject.queried_site_name"]
    # Context fields carried onto every row (first non-empty across sources).
    identity_fields:
      - query_subject.queried_company
      - query_subject.queried_city
      - query_subject.queried_state
    # Only reconcile records the extractor judged on-topic.
    relevance_flag: document_applicability.is_about_query_subject
    # The source URL for each record (becomes the citation list).
    citation_field: source_provenance.citation_url
    # Fields to reconcile from each item of the main_data_array. Each may carry
    # an optional `evidence` (verbatim quote) and `precision` (granularity)
    # companion field. Generic — categorical/flag fields (no evidence/precision)
    # are reconciled the same way. Order here does not matter.
    reconcile_fields:
      # Categorical outcome + phase flags (drive Gantt color / interpretation).
      - {field: lifecycle_status}
      - {field: is_expansion}
      - {field: construction_start_is_scheduled}
      # Lifecycle dates. FACT vs FORECAST are separate fields:
      #   date_operational        = ACTUAL go-live (already happened)
      #   date_expected_completion = PROJECTED completion (not yet operational)
      - {field: date_announced, evidence: evidence_announced, precision: precision_announced}
      - {field: date_construction_start, evidence: evidence_construction_start, precision: precision_construction_start}
      - {field: date_operational, evidence: evidence_operational, precision: precision_operational}
      - {field: date_expected_completion, evidence: evidence_expected_completion, precision: precision_expected_completion}
      # Project killed BEFORE completion (cancelled/withdrawn — never built).
      - {field: date_cancelled, evidence: evidence_cancelled, precision: precision_cancelled}
      # Facility retired AFTER operating (decommissioned — distinct from cancelled).
      - {field: date_decommissioned, evidence: evidence_decommissioned, precision: precision_decommissioned}
    # OPTIONAL chronology checks (omit for non-ordered domains). These checks are
    # ADVISORY only: rows are never dropped or rewritten to satisfy ordering.
    # Use branching constraints for mutually exclusive terminal outcomes so
    # FACT and FORECAST endpoints are each checked against construction start,
    # but never ordered against each other.
    ordering_constraints:
      - [date_announced, date_construction_start]
      - [date_construction_start, date_operational]
      - [date_construction_start, date_expected_completion]
      - [date_announced, date_decommissioned]
    # Pairs that cannot both be set in the same reconciled row.
    ordering_exclusive_pairs:
      - [date_operational, date_expected_completion]
      - [date_cancelled, date_decommissioned]
    # Select the precision-aware temporal comparator for the advisory check above
    # (other domains use "numeric" or the default "lexical"). This is what keeps
    # the synthesizer domain-neutral: temporal handling is opt-in, not hardwired.
    ordering_comparison: date
    # Strict default: when a precision companion field is missing, do not infer
    # coarse precision from Jan-1/month pins. This catches true out-of-order cases.
    ordering_infer_precision_from_pins: false
    # OPTIONAL extra free-text outputs the LLM should produce for this domain.
    narrative_fields:
      - current_status
    instructions: >-
      These are data-center facilities. Only accept dates that describe the
      facility's own lifecycle; never use a building 'year built' that predates
      the current project, and never use a source's publication date.
      FACT vs FORECAST is the central rule: put an ALREADY-ACHIEVED go-live in
      date_operational, and a PROJECTED/expected opening (facility not yet live)
      in date_expected_completion — never both, and never swap them. Keep
      date_cancelled and date_decommissioned mutually exclusive: use
      date_cancelled ONLY when the project was scrapped BEFORE it was ever
      operational (never built), and date_decommissioned ONLY when a facility
      that HAD been operational was later shut down / closed / retired. Set
      lifecycle_status to the most advanced state the sources support, and
      is_expansion=true when the record is a later phase/expansion of an
      existing campus (its announced date may postdate the base build — that is
      expected, not an error).
