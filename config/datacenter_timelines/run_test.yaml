# Test iteration config — 5 diverse sites for rapid query tuning
domain: datacenter_timelines_test

# ── Model tiers ──────────────────────────────────────────────────────────────
models:
  primary: gpt-5.6-terra               # extraction (accuracy-critical)
  secondary: claude-sonnet-4-6         # validation/QA/QC
  judge: claude-sonnet-5               # arbitration

discovery:
  targets_csv: targets_test5.csv

  queries:
    # Tier 1: Construction & operational status — uses state as reliable location
    - "{company_name} {state} {city?} data center construction OR completion OR operational OR \"now online\""
    # Tier 2: Announcement/groundbreaking with tighter phrasing
    - "{company_name} {state} {city?} data center \"announced\" OR \"broke ground\" OR \"groundbreaking\" OR \"plans to build\""
    # Tier 3: Directory/structured-data sources (carry "year built" and timelines)
    - "\"{site_name}\" data center baxtel OR datacentermap OR datacenterhawk"
    # Tier 4: Timeline, permits, and regulatory filings
    - "{company_name} {state} {city?} data center timeline OR permit OR \"expected to open\" OR \"target completion\""
    # Tier 5: Industry news with lifecycle keywords
    - "{company_name} {state} {city?} data center site:datacenterdynamics.com OR site:datacenterfrontier.com OR site:datacenterknowledge.com"
    # Tier 6: Project-name anchored announcement recall (helps older/ambiguous sites)
    - "\"{site_name}\" {company_name?} data center \"announced\" OR \"plans to build\" OR proposed OR unveiled"
    # Tier 7: Local-government records for dated approvals / withdrawals
    - "{company_name} {city?} {state} data center \"special use permit\" OR rezoning OR \"planning commission\" OR \"board of supervisors\" site:.gov"

  search:
    provider: serpapi
    max_results: 10
    cache: true
    google_news: false

  follow_links: false
  browser_mode: false

  selection:
    max_per_target: 10
    require_supported_document: false
    target_identity_require_any_templates:
      - "{site_name}"
      - "{city}"
      - "{company_name}"
    exclude:
      - "cutsheet"
      - "cut-sheet"
      - "spec-sheet"
      - "datasheet"
      - "/login"
      - "/signin"
      - "/careers"
      - "/privacy"
      - "/terms"
      - "/contact"
      - "youtube.com"
      - "facebook.com"
      - "twitter.com"
      - "x.com/"
      - "linkedin.com/company"
      - "instagram.com"
      - ".edu"
      - ".ac."
      - "researchgate"
      - "ssrn"
      - "arxiv"
      - "semanticscholar"
      - "sciencedirect"
      - "springer"
      - "ieee.org"
      - "congress.gov"
      - "senate.gov"
      - "census.gov"
      - "sec.gov"
      - "crunchbase"
      - "finance.yahoo"
      - "seekingalpha"
      - "marketwatch"
      - "investor."
      - "fraser.stlouisfed.org"
      - "ugr.es"
      - "usmodernist.org"
      - "hartenergy.com"
      # -- Job sites (no project dates) --
      - "ziprecruiter.com"
      - "indeed.com"
      - "glassdoor.com"
      - "jobs."
      - "careers."
      - "/careers/"
      - "/jobs/"
      # -- Broad listings without temporal data --
      - "linkedin.com"
      - "servercountry.org"

  request_delay_ms: 400

# ── QA/QC (Validation) ───────────────────────────────────────────────────────
validation:
  models: [primary, secondary]
  output_dir: validated/datacenter_timelines_test
  report:
    include_csv: false
    include_missing_in_queue: true
    include_low_signal_presence_in_queue: false
    identity_columns: compact
    include_value_unit_column: true
  comparison_approach: mixed
  record_matching:
    key_fields: [queried_site_name, project_name, lifecycle_status]
    fuzzy_key_fields: [project_name]
    semantic_match_threshold: 0.38
    anchor:
      fields: [project_name]
      method: char_ngram
      ngram: 4
      auto_threshold: 0.65
      review_threshold: 0.35
      max_candidates_per_row: 3
      min_anchor_chars: 8
  comparison:
    primary_fields: [
      # Quantitative (dates with precision)
      date_announced, precision_announced, evidence_announced,
      date_construction_start, precision_construction_start, evidence_construction_start,
      date_operational, precision_operational, evidence_operational,
      date_expected_completion, precision_expected_completion, evidence_expected_completion,
      date_cancelled, precision_cancelled, evidence_cancelled,
      date_decommissioned, precision_decommissioned, evidence_decommissioned,
      # Qualitative (project status and details)
      project_name, lifecycle_status, is_expansion, construction_start_is_scheduled, is_cancelled
    ]

extraction:
  model: primary
  input_dir: discovered/datacenter_timelines_test/latest/curated
  schema: schemas/personal/datacenter_timelines_schema.json
  output_dir: extracted/datacenter_timelines_test

  pages:
    auto_locate:
      section_description: >-
        the passage(s) that state WHEN this specific data-center facility/project
        reached a lifecycle milestone — when it was announced/proposed, when
        construction/groundbreaking occurred or is scheduled, when it opened /
        became operational / was completed, its expected completion date, or when
        it was cancelled or decommissioned. Not general company background,
        financials, environmental-impact boilerplate, tables of contents, or
        unrelated projects.
      keywords:
        - "data center"
        - "data centre"
        - "datacenter"
        - "groundbreaking"
        - "broke ground"
        - "construction"
        - "operational"
        - "completion"
        - "announced"
        - "approved"
        - "permit"
        - "megawatt"
        - "MW"
      trigger_chars: 60000
      max_selected_pages: 12

compilation:
  input_dir: extracted/datacenter_timelines_test
  schema: schemas/personal/datacenter_timelines_schema.json
  output_dir: compiled/datacenter_timelines_test

  synthesis:
    model: primary
    enabled: true
    min_sources_for_llm: 2
    group_by: ["query_subject.queried_site_name"]
    identity_fields:
      - query_subject.queried_company
      - query_subject.queried_city
      - query_subject.queried_state
    relevance_flag: document_applicability.is_about_query_subject
    citation_field: source_provenance.citation_url
    reconcile_fields:
      - {field: lifecycle_status}
      - {field: is_expansion}
      - {field: construction_start_is_scheduled}
      - {field: date_announced, evidence: evidence_announced, precision: precision_announced}
      - {field: date_construction_start, evidence: evidence_construction_start, precision: precision_construction_start}
      - {field: date_operational, evidence: evidence_operational, precision: precision_operational}
      - {field: date_expected_completion, evidence: evidence_expected_completion, precision: precision_expected_completion}
      - {field: date_cancelled, evidence: evidence_cancelled, precision: precision_cancelled}
      - {field: date_decommissioned, evidence: evidence_decommissioned, precision: precision_decommissioned}
    ordering_constraints:
      - [date_announced, date_construction_start]
      - [date_construction_start, date_operational]
      - [date_construction_start, date_expected_completion]
      - [date_announced, date_decommissioned]
    ordering_exclusive_pairs:
      - [date_operational, date_expected_completion]
      - [date_cancelled, date_decommissioned]
    ordering_comparison: date
    ordering_infer_precision_from_pins: false
    narrative_fields:
      - current_status
    instructions: >-
      These are data-center facilities. Only accept dates that describe the
      facility's own lifecycle; never use a building 'year built' that predates
      the current project, and never use a source's publication date.
      FACT vs FORECAST is the central rule: put an ALREADY-ACHIEVED go-live in
      date_operational, and a PROJECTED/expected opening (facility not yet live)
      in date_expected_completion — never both, and never swap them. Keep
      date_cancelled and date_decommissioned mutually exclusive: use
      date_cancelled ONLY when the project was scrapped BEFORE it was ever
      operational (never built), and date_decommissioned ONLY when a facility
      that HAD been operational was later shut down / closed / retired. Set
      lifecycle_status to the most advanced state the sources support, and
      is_expansion=true when the record is a later phase/expansion of an
      existing campus (its announced date may postdate the base build — that is
      expected, not an error).
