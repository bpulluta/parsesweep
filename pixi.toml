[workspace]
authors = ["Super Team"]
channels = ["conda-forge"]
name = "psweep"
platforms = ["win-64", "osx-arm64", "osx-64", "linux-64"]
version = "2.0.1"

[dependencies]
poppler = ">=24.8.0,<25"
python = ">=3.9,<3.13"

# Core dependencies for psweep
beautifulsoup4 = ">=4.12.0,<5"
click = ">=8.1.0,<9"
lxml = ">=4.9.0,<6"
numpy = ">=1.24.0,<2"
openai = ">=1.0.0,<2"
pandas = ">=2.0.0,<3"
python-dotenv = ">=1.0.0,<2"
pydantic = ">=2.5.0,<3"
jsonschema = ">=4.20.0,<5"
tqdm = ">=4.66.0,<5"
pyyaml = ">=6.0.0,<7"
requests = ">=2.31.0,<3"
tesseract = ">=5.5.1,<6"
langchain-text-splitters = ">=1.0.0,<2"
pdftotext = ">=2.2.2,<3"
openpyxl = ">=3.1.5,<4"
python-docx = ">=1.1.0,<2"
rich = ">=13.7.0,<14"
pytest = ">=9.0.2,<10"

# PyPI-only dependencies
[pypi-dependencies]
pymupdf4llm = ">=0.0.5"
pymupdf = ">=1.23.0"
pypdf = ">=3.17.0"
langextract = ">=1.0.0"
selenium = ">=4.15.0"  # Moved to PyPI for better cross-platform support
litellm = ">=1.52.0"  # Unified LLM interface for OpenAI, Claude, Gemini, etc.
google-search-results = ">=2.4.2"  # Optional: SerpApi seeker for acquisition
psweep = { path = ".", editable = true}

[environments]
default = { solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }

[feature.dev.dependencies]
ruff = ">=0.14.1,<0.15"
pytest = ">=7.4.0"
pytest-cov = ">=4.1.0"
jupyter = ">=1.1.1,<2"
ipykernel = ">=7.1.0,<8"
