[workspace]
authors = ["Super Team"]
channels = ["conda-forge"]
name = "psweep"
platforms = ["win-64", "osx-arm64", "osx-64", "linux-64"]

[dependencies]
# Native tools stay in Conda; pyproject.toml owns Python runtime requirements.
poppler = ">=24.8.0"
python = ">=3.12,<3.13"
tesseract = ">=5.5.1,<6"
pdftotext = ">=2.2.2,<3"
pytest = ">=9.0.3,<10"
ffmpeg = { version = ">=9.0.2,<10", build = "lgpl*" }
[pypi-dependencies]
psweep = { path = ".", editable = true}

[environments]
default = { solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }
docs = { features = ["docs"], solve-group = "default" }

[feature.dev.pypi-dependencies]
psweep = { path = ".", editable = true, extras = ["dev"] }

# Lint lives in the dev feature, so `pixi run lint` selects that env. CI runs it.
[feature.dev.tasks]
lint = "ruff check src tests && ruff format --check src tests"

[feature.docs.pypi-dependencies]
psweep = { path = ".", editable = true, extras = ["docs"] }

[tasks]
# `python -m pytest` works in every env; the bare `pytest` console script is not
# on the default env's PATH. Run the full suite with `pixi run test`.
test = "python -m pytest"

# Docs tasks live in the docs feature, so `pixi run docs-build` selects that env.
[feature.docs.tasks]
# Clean first: autoapi's build-finished step can crash on stale incremental
# state, so a from-scratch build is the reliable one (and matches CI).
docs-build = { cmd = "sphinx-build -b html docs docs/_build/html -W", depends-on = ["docs-clean"] }
docs-serve = "python -m http.server 8000 --directory docs/_build/html"
docs-clean = "rm -rf docs/_build"
