[workspace]
authors = ["Super Team"]
channels = ["conda-forge", "microsoft"]
name = "backupgensprint"
platforms = ["win-64", "osx-arm64", "osx-64", "linux-64", "linux-aarch64"]
version = "0.1.0"

[tasks]

[dependencies]
python = ">=3.11"
langextract = ">=1.0.8,<2"

[pypi-dependencies]
nrel-compass = ">=0.9.0, <0.10"

[environments]
default = { features = ["default"], solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }

[feature.dev.dependencies]
ruff = ">=0.14.1,<0.15"
