[build-system]
requires = ["setuptools>=84.1.0", "wheel>=0.46.2"]
build-backend = "setuptools.build_meta"

[project]
name = "psweep"
version = "2.0.1"
description = "ParseSweep: Universal document extraction system - extract structured data from ANY document type using schemas + LLMs"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "NREL Team", email = "contact@nrel.gov"}
]
keywords = ["document extraction", "pdf extraction", "data extraction", "LLM", "AI extraction", "structured data"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]

dependencies = [
    "pandas>=2.1.0,<3",
    "numpy>=1.26.0,<2",
    "requests>=2.33.0,<3",
    "httpx>=0.28.1,<1",
    "urllib3>=2.8.0,<3",
    "truststore>=0.10.5,<1",
    "beautifulsoup4>=4.12.0,<5",
    "lxml>=6.1.0,<7",
    "selenium>=4.15.0,<5",
    "pymupdf4llm>=0.0.5,<1",
    "pymupdf>=1.26.7,<2",
    "pypdf>=6.21.3,<7",
    "openai>=2.20.0,<3",
    "litellm>=1.96.2,<2",
    # Avoid later 3.x lock regressions while LiteLLM excludes fixed 4.2.1.
    # Two local-filesystem advisories still affect this compatible release.
    "filelock==3.20.3",
    "langextract>=1.0.0,<2",
    "pydantic>=2.5.0,<3",
    "jsonschema>=4.20.0,<5",
    "tqdm>=4.66.0,<5",
    "python-dotenv>=1.2.2,<2",
    "pyyaml>=6.0.3,<7",
    "click>=8.1.0,<9",
    "langchain-text-splitters>=1.1.2,<2",
    "openpyxl>=3.1.5,<4",
    "python-docx>=1.1.0,<2",
    "rich>=13.9.4,<14",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3,<10",
    "pytest-cov>=4.1.0",
    "ruff>=0.14.1,<0.15",
    "mypy>=1.7.0",
    "pip-audit>=2.10.1,<3",
    "pip>=26.2,<27",
    "build>=1.6.1,<2",
    "setuptools>=84.1.0",
    "wheel>=0.46.2",
    "matplotlib>=3.8.0,<4",
    "jupyter>=1.1.1,<2",
    "ipykernel>=7.1.0,<8",
]
docs = [
    "sphinx>=9.1.0",
    "sphinx-autoapi>=3.0.0",
    "furo>=2024.8.6",
    "myst-parser>=4.0.0",
    "sphinx-click>=6.0.0",
    "sphinx-copybutton>=0.5.2",
]

[project.scripts]
psweep = "psweep.cli.app:main"

[project.urls]
Homepage = "https://github.com/bpulluta/parsesweep"
Repository = "https://github.com/bpulluta/parsesweep"
Issues = "https://github.com/bpulluta/parsesweep/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["psweep*"]

[tool.setuptools.package-data]
# Bundled reference data (e.g. the Census county->FIPS lookup) must ship in the wheel.
psweep = ["**/data/*.csv", "**/data/*.json"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
preview = true
select = [
  "A", # flake8-builtins
  "B", # flake8-bugbear
  "ARG", # flake8-unused-arguments
  "BLE", # flake8-blind-except
  "C4", # flake8-comprehensions
  "C90", # mccabe
  "COM", # flake8-commas
  "D", # pydocstyle
  "E", # pycodestyle
  "EM", # flake8-errmsg
  "F", # Pyflakes
  "FURB", # refurb
  "FLY", #  flynt
  "G", # flake8-logging-format
  "I", # isort
  "INP", # flake8-no-pep420
  "ISC", # flake8-implicit-str-concat
  "LOG", # flake8-logging
  "N", # pep8-naming
  "NPY", # numpy-specific
  "PD", # pandas-vet
  "PERF", # Perflint
  "PIE", # flake8-pie
  "PL", # Pylint
  "PTH", # flake8-use-pathlib
  "PYI", # flake8-pyi
  "Q", # flake8-quotes
  "RET", # flake8-return
  "RSE", # flake8-raise
  "RUF", # Ruff-specific rules
  "S", # flake8-bandit
  "SLF", # flake8-self
  "SIM", # flake8-simplify
  "TID", # flake8-tidy-imports (absolute imports)
  "TRY", # tryceratops
  "UP", # pyupgrade
  "W", # Warning
]
ignore = [
  "B028", # no-explicit-stacklevel
  # Complexity/size metrics: refactors are out of scope for lint; they do not
  # flag bugs.
  "C901", # complex-structure
  "PLR0904", # too-many-public-methods
  "PLR0911", # too-many-return-statements
  "PLR0912", # too-many-branches
  "PLR0913", # too-many-arguments
  "PLR0914", # too-many-locals
  "PLR0915", # too-many-statements
  "PLR0917", # too-many-positional-arguments
  "PLR1702", # too-many-nested-blocks
  "PLR2004", # magic-value-comparison
  "COM812", # missing-trailing-comma (incompatible with formatter)
  "D105", # undocumented-magic-method
  # Message strings inline in raise: same family as TRY003 (ignored below).
  "EM101", # raw-string-in-exception
  "EM102", # f-string-in-exception
  "D205", # blank-line-after-summary
  "D202", # no-blank-lines-after-function
  "D210", # surrounded-whitespace
  "D400", # first-line-should-end-with-a-period
  "D401", # non-imperative-mood
  "D403", # first-line-capitalized
  "FURB140", # reimplemented-starmap
  "I001", # unsorted-imports
  # Lazy imports keep CLI startup fast and optional dependencies optional.
  "PLC0415", # import-outside-top-level
  "PD008", # pandas-use-of-dot-at (.at is the fast scalar accessor)
  "PLR6301", # no-self-use (methods kept for interface/override cohesion)
  "PYI024", # collections-named-tuple
  "RUF012", # mutable-class-default
  "RUF031", # incorrectly-parenthesized-tuple-in-subscript
  "RUF067", # non-empty-init-module (packages re-export their public API)
  "S101", # assert
  "S324", # hashlib-insecure-hash-function
  "S403", # suspicious-pickle-import
  "TRY003", # raise-vanilla-args
  "TRY301", # raise-within-try (raising into a shared local handler is intended)
]

[tool.ruff.lint.pycodestyle]
max-doc-length = 100

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = [
  "F401", # unused-import
]
"src/psweep/cli/**.py" = [
  # Click uses a literal "\b" in command docstrings to mark paragraphs as
  # no-rewrap in --help output. It must stay a real escape (backspace), so the
  # docstring cannot be a raw string; D301 conflicts with this framework idiom.
  "D301", # escape-sequence-in-docstring
]
"tests/**.py" = [
  "ARG001", # unused-function-argument (fixture/stub signatures)
  "ARG002", # unused-method-argument
  "ARG005", # unused-lambda-argument (monkeypatched callables mirror signatures)
  "D100", # undocumented-public-module
  "D103", # undocumented-public-function (test names are the documentation)
  "D101", # undocumented-public-class
  "D102", # undocumented-public-method
  "G004", # logging-f-string
  "INP001", # implicit-namespace-package
  "N806", # non-lowercase-variable-in-function
  "PLC1901", # compare-to-empty-string (asserts check the exact empty value)
  "PLC2701", # import-private-name
  "S108", # hardcoded-temp-file (fake paths in fixtures; never written)
  "SLF001", # private-member-access
]

[tool.ruff.lint.pylint]
max-args = 10
max-positional-args = 10


[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v"
filterwarnings = [
    "ignore::DeprecationWarning:.*importlib._bootstrap.*",
    "ignore:builtin type.*has no __module__ attribute:DeprecationWarning",
]
