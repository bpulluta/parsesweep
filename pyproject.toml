[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "permit-toolkit"
version = "0.1.0"
description = "Hybrid extraction toolkit for air quality permits using OpenAI + LangExtract"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "NREL Team", email = "contact@nrel.gov"}
]
keywords = ["air quality", "permits", "data extraction", "LLM", "backup generators", "hybrid extraction"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]

dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=4.9.0",
    "selenium>=4.15.0",
    "pymupdf4llm>=0.0.5",
    "pymupdf>=1.23.0",
    "pypdf>=3.17.0",
    "openai>=1.0.0",
    "langextract>=1.0.0",
    "pydantic>=2.5.0",
    "jsonschema>=4.20.0",
    "tqdm>=4.66.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.1",
    "click>=8.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
]
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.4.0",
]

[project.scripts]
permit-toolkit = "permit_toolkit.cli.main:main"

[project.urls]
Homepage = "https://github.com/NREL/backupgensprint"
Repository = "https://github.com/NREL/backupgensprint"
Issues = "https://github.com/NREL/backupgensprint/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["permit_toolkit*"]

[tool.black]
line-length = 100
target-version = ['py39']

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=permit_toolkit --cov-report=term-missing"
