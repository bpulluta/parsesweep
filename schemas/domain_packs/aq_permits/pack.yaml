name: aq_permits
version: 1.1.0
schema_path: schemas/personal/air_quality_permits_schema.json
document_type: Air Quality Permit
qaqc:
  default_lane: quantitative
  lanes:
    quantitative:
      enabled: true
      mode: quantitative
      comparison_approach: numeric_only
      record_matching:
        key_fields:
          - referenceNumber
          - make
          - model
      comparison:
        primary_fields:
          - ratedCapacityKW
          - ratedCapacityBHP
          - ratedCapacityHP
          - ratedCapacityMMBtuPerHr
          - operatingHoursPerUnitLimit
          - operatingHoursCombinedLimit
          - fuelThroughputPerUnitLimit
          - fuelThroughputCombinedLimit
          - numGenerators
    qualitative:
      enabled: false
      mode: qualitative
      comparison_approach: text_review
      record_matching:
        key_fields:
          - referenceNumber
          - make
          - model
      comparison:
        primary_fields:
          - controlTechnology
          - primaryFuelType
modules:
  - module_id: value_semantics_classifier
    name: Value Semantics Classifier
    version: 1.0.0
    kind: classifier
    enabled: true
  - module_id: eligibility_policy_engine
    name: Eligibility Policy Engine
    version: 1.0.0
    kind: policy
    enabled: true
  - module_id: lane_projector
    name: Lane Projector
    version: 1.0.0
    kind: projector
    enabled: true
  - module_id: consolidation_mapper
    name: Consolidation Mapper
    version: 1.0.0
    kind: mapper
    enabled: true