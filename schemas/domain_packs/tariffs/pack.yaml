name: tariffs
version: 1.1.0
schema_path: schemas/personal/electricity_tariff_schema.json
document_type: Electricity Tariff
qaqc:
  default_lane: quantitative
  lanes:
    quantitative:
      enabled: true
      mode: quantitative
      comparison_approach: numeric_only
      projection:
        type: nested_array_items
        source_array: rate_schedules
        nested_array: charges
        parent_fields:
          - rate_name
          - is_rider
          - sector
      record_matching:
        key_fields:
          - rate_name
          - charge_type
          - charge_description
          - season
          - time_period
      comparison:
        primary_fields:
          - rate
          - unit
    qualitative:
      enabled: false
      mode: qualitative
      comparison_approach: text_review
      projection:
        type: nested_array_items
        source_array: rate_schedules
        nested_array: charges
        parent_fields:
          - rate_name
          - is_rider
          - sector
      record_matching:
        key_fields:
          - rate_name
          - charge_type
          - charge_description
          - season
          - time_period
      comparison:
        primary_fields:
          - extracted_text
modules:
  - module_id: value_semantics_classifier
    name: Value Semantics Classifier
    version: 1.0.0
    kind: classifier
    enabled: true
  - module_id: eligibility_policy_engine
    name: Eligibility Policy Engine
    version: 1.0.0
    kind: policy
    enabled: true
  - module_id: lane_projector
    name: Lane Projector
    version: 1.0.0
    kind: projector
    enabled: true
  - module_id: consolidation_mapper
    name: Consolidation Mapper
    version: 1.0.0
    kind: mapper
    enabled: true